services:
  - type: web
    name: tienda-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false   # pega aquí tu cadena de MongoDB Atlas en el panel de Render
